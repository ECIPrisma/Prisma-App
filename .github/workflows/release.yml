name: Release APK

# Publica un APK firmado en GitHub Releases al crear un tag vX.Y.Z (costo $0).
# Secrets requeridos: PRISMA_KEYSTORE_B64, PRISMA_KEYSTORE_PASSWORD,
#                     PRISMA_KEY_ALIAS, PRISMA_KEY_PASSWORD
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Restaurar keystore
        run: echo "${{ secrets.PRISMA_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/prisma.jks"
      - name: Build release firmado
        env:
          PRISMA_KEYSTORE_PATH: ${{ runner.temp }}/prisma.jks
          PRISMA_KEYSTORE_PASSWORD: ${{ secrets.PRISMA_KEYSTORE_PASSWORD }}
          PRISMA_KEY_ALIAS: ${{ secrets.PRISMA_KEY_ALIAS }}
          PRISMA_KEY_PASSWORD: ${{ secrets.PRISMA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
